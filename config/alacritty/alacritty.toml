[general]
import = ["colors.toml"]


[font]
size = 12.0

[font.normal]
family = "MapleMono NF CN"
style  = "Bold"

[font.bold]
family = "MapleMono NF CN"
style = "Bold"

[font.italic]
family = "MapleMono NF CN"
style = "Bold Italic"

[font.bold_italic]
family = "MapleMono NF CN"
style = "Bold Italic"

[terminal.shell]
program = "zsh"

[cursor]
style = { shape = "Beam", blinking = "Off" }

[window]
opacity = 0.80
blur = false

[window.padding]
x = 23
y = 20

[window.dimensions]
columns = 80
lines = 24

[bell]
duration = 0
