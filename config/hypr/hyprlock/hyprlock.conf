source = colors.conf

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
  # NOTE: use only 1 path
	#path = screenshot   # screenshot of your desktop
	#path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_modified # by wallpaper effects
    path = $image  # CURRENT WALLPAPER
    
    color = rgb(0,0,0) # color will be rendered initially until path is available

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 6
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}


# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $on_secondary_container
    font_size = 120
    font_family = Rubik
    shadow_passes = 0
    shadow_size = 0

    position = 0, 280
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = Rubik
    shadow_passes = 0
    shadow_size = 0

    position = 0, 150
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = $secondary
    font_size = 18
    font_family = Rubik

    position = 0, 65
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $secondary
    font_size = 14
    font_family = Rubik Medium 10

    position = 0, 35
    halign = center
    valign = center
}

# Degrees
#label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = $color8
    font_size = 14
    font_family = JetBrainsMono NFM

    position = 0, 40
    halign = center
    valign = bottom
}

# USER
#label {
    monitor =
    text = $USER
    color = $color8
    font_size = 14
    font_family = Maple Mono NF CN
    position = 0, 200
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 150, 45
    outline_thickness = 1

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1
    font_family = Rubik Medium
    rounding = 22
    outer_color = rgba(255, 255, 255, 0.20)
    inner_color = rgba(100, 114, 125, 0.4)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
     placeholder_text = Enter Password
    placeholder_color = rgba(255, 255, 255, 0.4) # Text rendered in the input box when it's empty.

    position = 0, 113
    halign = center
    valign = bottom
}

# Profie-Photo
image {
    monitor =
    # Subtle translucent macOS border ring
    border_size = 2
    border_color = rgba(255, 255, 255, 0.02)
    path = ~/.config/hypr/hyprlock/aay.png
    size = 110
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -265
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = aayu
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = Oswald Medium
    position = 0, -350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/spot.sh)"
    color = rgba(255, 255, 255, 0.75)
    outline_thickness = 10
    font_size = 12
    font_family = Rubik Medium
    position = 0, 53
    halign = center
    valign = bottom
}
